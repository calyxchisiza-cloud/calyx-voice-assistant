<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="void" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0d1a2e" />
      <stop offset="46%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafaff" />
      <stop offset="42%" stop-color="#6fe7ff" />
      <stop offset="100%" stop-color="#1d7fa8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fe7ff" />
      <stop offset="55%" stop-color="#9a7bff" />
      <stop offset="100%" stop-color="#2ec5e8" stop-opacity=".35" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#void)" />

  <!-- outer orbit rings -->
  <g filter="url(#glow)" opacity=".92">
    <ellipse cx="256" cy="256" rx="176" ry="176" fill="none" stroke="url(#ring)" stroke-width="7" opacity=".55" />
    <ellipse cx="256" cy="256" rx="196" ry="96" transform="rotate(-24 256 256)" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".5" />
    <ellipse cx="256" cy="256" rx="150" ry="206" transform="rotate(38 256 256)" fill="none" stroke="#2ec5e8" stroke-width="4" opacity=".38" />
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="132" fill="url(#core)" opacity=".8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="86" fill="none" stroke="#dff6ff" stroke-width="9" opacity=".95" filter="url(#glow)" />
  <circle cx="256" cy="256" r="30" fill="#eafaff" filter="url(#glow)" />

  <!-- node dust -->
  <g fill="#6fe7ff" opacity=".85">
    <circle cx="256" cy="86" r="7" />
    <circle cx="420" cy="208" r="6" />
    <circle cx="404" cy="352" r="5" />
    <circle cx="118" cy="330" r="6" />
    <circle cx="96" cy="184" r="5" />
    <circle cx="322" cy="430" r="5" />
    <circle cx="176" cy="446" r="4" />
  </g>
</svg>
